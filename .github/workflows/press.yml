name: press
# The distribution mesh (press/auto.py, the STPi/TightBucket press adapted to AttestOS): four slots a day author,
# validate and publish value + promo posts across Buffer accounts A/B/C (company + optional seller sets _A/_B) and
# the direct rails (Bluesky, dev.to, Nostr, Whop forums, Telegram, Mastodon, Discord), then answer replies.
#
# Off until the owner turns it on: set the repo variable PRESS_ENABLED=1 once the first rail keys exist
# (docs/MESH-SETUP.md). A skipped scheduled job never gets a runner.
# Every rail stays silent until its own secrets exist: add a secret named exactly like the env var
# (AO_BUFFER_TOKEN_A_CO, AO_BSKY_ID, ...) and that rail starts on the next slot. No workflow edit needed.
#
# PUBLIC REPOSITORY RULES (this file is the only place press secrets are read):
# - triggers are schedule + workflow_dispatch only (never pull_request: forks must not see secrets);
# - no actions/cache of login sessions (caches are readable by anyone who can run a workflow here) - Bluesky
#   simply logs in fresh each slot (4 a day, far inside its session limits);
# - the press-state ledger branch is public: it holds post texts, ids and timestamps, never keys.
# Public repositories get free Actions minutes, so there is no minutes guard here.
on:
  schedule:
    - cron: "15 6 * * *"     # 08:15 / 12:15 / 16:15 / 20:15 Harare: four reader-hour slots, weekends included
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = plan + validate only; live = publish; live-draft = publish, long-form as dev.to draft"
        required: false
        default: "live"

permissions:
  contents: write   # the ledger round-trips through the press-state branch
  models: read      # GitHub Models as a free author lane with the run's own token

concurrency: { group: press, cancel-in-progress: false }

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.PRESS_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AO_BSKY_SESSIONS_FILE: /tmp/press-sessions/bsky.json   # runner-local (outside the repo), discarded with the VM
      AO_SITE_URL: ${{ vars.AO_SITE_URL || 'https://attestos-edge.attestos.workers.dev' }}
      AO_VIDEOS_REPO: ${{ vars.AO_VIDEOS_REPO || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: restore ledger (press-state branch)
        run: |
          if git ls-remote --exit-code --heads origin press-state >/dev/null 2>&1; then
            git fetch -q --depth 1 origin press-state
            git worktree add -q .press-state FETCH_HEAD
            [ -d .press-state/auto ] || { echo "::error::press-state has no auto/ - refusing to run amnesiac"; exit 1; }
            rm -rf press/auto && cp -a .press-state/auto press/auto
          else
            echo "first run: the ledger starts empty"; mkdir -p press/auto
          fi

      - name: videos repo (Buffer C + Reels; skipped until AO_VIDEOS_REPO is set)
        if: env.AO_VIDEOS_REPO != ''
        run: git clone -q --depth 1 "https://github.com/${AO_VIDEOS_REPO}.git" press/videos-repo || echo "::warning::videos repo unreachable; video rails skip this slot"

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: press/requirements.txt }
      - run: pip install -q -r press/requirements.txt

      - name: export press secrets (explicit allow-list; Cloudflare keys and AO_OPS_TOKEN never reach the press)
        # 2026-10-28: secrets are named one by one. Dumping the whole secrets context as JSON got
        # this public repo's workflow flagged by GitHub as "may be malicious" (runs held at
        # action_required). Only non-empty values are exported, so code defaults still apply.
        # New rail secret? Add one S_<NAME> line here (docs/MESH-SETUP.md lists them).
        env:
          GH_RUN_TOKEN: ${{ github.token }}
          S_AO_PRESS_TOKEN: ${{ secrets.AO_PRESS_TOKEN }}
          S_AO_PRESS_ENABLED: ${{ secrets.AO_PRESS_ENABLED }}
          S_AO_PRESS_LLM_CALLS_PER_RUN: ${{ secrets.AO_PRESS_LLM_CALLS_PER_RUN }}
          S_AO_PROMO_TOPICS_PER_RUN: ${{ secrets.AO_PROMO_TOPICS_PER_RUN }}
          S_AO_DEVTO_KEY: ${{ secrets.AO_DEVTO_KEY }}
          S_AO_DISCORD_PRESS_WEBHOOK: ${{ secrets.AO_DISCORD_PRESS_WEBHOOK }}
          S_AO_FB_PAGE_ID: ${{ secrets.AO_FB_PAGE_ID }}
          S_AO_FB_PAGE_TOKEN: ${{ secrets.AO_FB_PAGE_TOKEN }}
          S_AO_LI_REPLY_TOKEN: ${{ secrets.AO_LI_REPLY_TOKEN }}
          S_AO_MASTODON_INSTANCE: ${{ secrets.AO_MASTODON_INSTANCE }}
          S_AO_MASTODON_TOKEN: ${{ secrets.AO_MASTODON_TOKEN }}
          S_AO_NOSTR_NSEC: ${{ secrets.AO_NOSTR_NSEC }}
          S_AO_TG_BOT_TOKEN: ${{ secrets.AO_TG_BOT_TOKEN }}
          S_AO_TG_CHANNEL: ${{ secrets.AO_TG_CHANNEL }}
          S_AO_X_REPLY_TOKEN: ${{ secrets.AO_X_REPLY_TOKEN }}
          S_AO_X_REPLY_UID: ${{ secrets.AO_X_REPLY_UID }}
          S_AO_CHANNEL_TWITTER: ${{ secrets.AO_CHANNEL_TWITTER }}
          S_WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          S_WHOP_APP_KEY: ${{ secrets.WHOP_APP_KEY }}
          S_WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          S_WHOP_PUBLIC_EXP_ID: ${{ secrets.WHOP_PUBLIC_EXP_ID }}
          S_WHOP_PRIVATE_EXP_ID: ${{ secrets.WHOP_PRIVATE_EXP_ID }}
          S_WHOP_PRIVATE_CHANNEL_ID: ${{ secrets.WHOP_PRIVATE_CHANNEL_ID }}
          S_WHOP_COMPANY_TITLES: ${{ secrets.WHOP_COMPANY_TITLES }}
          S_WHOP_FORUMS_APP: ${{ secrets.WHOP_FORUMS_APP }}
          S_WHOP_MEMBER_EXP_NAME: ${{ secrets.WHOP_MEMBER_EXP_NAME }}
          S_PRESS_WHOP_CHANNEL: ${{ secrets.PRESS_WHOP_CHANNEL }}
          S_PRESS_WHOP_PRIVATE_EXP: ${{ secrets.PRESS_WHOP_PRIVATE_EXP }}
          S_PRESS_LLM_API_KEY: ${{ secrets.PRESS_LLM_API_KEY }}
          S_PRESS_LLM_BASE: ${{ secrets.PRESS_LLM_BASE }}
          S_PRESS_LLM_MODEL: ${{ secrets.PRESS_LLM_MODEL }}
          S_PRESS_BUFFER_X_CHANNEL_ID: ${{ secrets.PRESS_BUFFER_X_CHANNEL_ID }}
          S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          S_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          S_CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          S_AO_BSKY_ID: ${{ secrets.AO_BSKY_ID }}
          S_AO_BSKY_PASS: ${{ secrets.AO_BSKY_PASS }}
          S_PRESS_PINBOARD: ${{ secrets.PRESS_PINBOARD }}
          S_AO_PINBOARD: ${{ secrets.AO_PINBOARD }}
          S_AO_BSKY_ID_A: ${{ secrets.AO_BSKY_ID_A }}
          S_AO_BSKY_PASS_A: ${{ secrets.AO_BSKY_PASS_A }}
          S_PRESS_PINBOARD_A: ${{ secrets.PRESS_PINBOARD_A }}
          S_AO_PINBOARD_A: ${{ secrets.AO_PINBOARD_A }}
          S_AO_SITE_URL_A: ${{ secrets.AO_SITE_URL_A }}
          S_AO_BSKY_ID_B: ${{ secrets.AO_BSKY_ID_B }}
          S_AO_BSKY_PASS_B: ${{ secrets.AO_BSKY_PASS_B }}
          S_PRESS_PINBOARD_B: ${{ secrets.PRESS_PINBOARD_B }}
          S_AO_PINBOARD_B: ${{ secrets.AO_PINBOARD_B }}
          S_AO_SITE_URL_B: ${{ secrets.AO_SITE_URL_B }}
          S_AO_BUFFER_TOKEN_A_CO: ${{ secrets.AO_BUFFER_TOKEN_A_CO }}
          S_AO_BUFFER_TOKEN_A_A: ${{ secrets.AO_BUFFER_TOKEN_A_A }}
          S_AO_BUFFER_TOKEN_B_A: ${{ secrets.AO_BUFFER_TOKEN_B_A }}
          S_AO_BUFFER_TOKEN_B_CO: ${{ secrets.AO_BUFFER_TOKEN_B_CO }}
          S_AO_BUFFER_TOKEN_A_B: ${{ secrets.AO_BUFFER_TOKEN_A_B }}
          S_AO_BUFFER_TOKEN_B_B: ${{ secrets.AO_BUFFER_TOKEN_B_B }}
          S_AO_BUFFER_TOKEN_C_CO: ${{ secrets.AO_BUFFER_TOKEN_C_CO }}
          S_AO_BUFFER_TOKEN_A_C: ${{ secrets.AO_BUFFER_TOKEN_A_C }}
          S_AO_BUFFER_TOKEN_B_C: ${{ secrets.AO_BUFFER_TOKEN_B_C }}
          S_AO_BUFFER_TOKEN: ${{ secrets.AO_BUFFER_TOKEN }}
          S_AO_BUFFER_TOKEN_A: ${{ secrets.AO_BUFFER_TOKEN_A }}
          S_AO_BUFFER_TOKEN_B: ${{ secrets.AO_BUFFER_TOKEN_B }}
          S_AO_CHANNEL_X: ${{ secrets.AO_CHANNEL_X }}
          S_AO_CHANNEL_X_A: ${{ secrets.AO_CHANNEL_X_A }}
          S_AO_CHANNEL_X_B: ${{ secrets.AO_CHANNEL_X_B }}
          S_AO_CHANNEL_LINKEDIN: ${{ secrets.AO_CHANNEL_LINKEDIN }}
          S_AO_CHANNEL_LINKEDIN_A: ${{ secrets.AO_CHANNEL_LINKEDIN_A }}
          S_AO_CHANNEL_LINKEDIN_B: ${{ secrets.AO_CHANNEL_LINKEDIN_B }}
          S_AO_CHANNEL_PINTEREST: ${{ secrets.AO_CHANNEL_PINTEREST }}
          S_AO_CHANNEL_PINTEREST_A: ${{ secrets.AO_CHANNEL_PINTEREST_A }}
          S_AO_CHANNEL_PINTEREST_B: ${{ secrets.AO_CHANNEL_PINTEREST_B }}
          S_AO_CHANNEL_FACEBOOK: ${{ secrets.AO_CHANNEL_FACEBOOK }}
          S_AO_CHANNEL_FACEBOOK_A: ${{ secrets.AO_CHANNEL_FACEBOOK_A }}
          S_AO_CHANNEL_FACEBOOK_B: ${{ secrets.AO_CHANNEL_FACEBOOK_B }}
          S_AO_CHANNEL_INSTAGRAM: ${{ secrets.AO_CHANNEL_INSTAGRAM }}
          S_AO_CHANNEL_INSTAGRAM_A: ${{ secrets.AO_CHANNEL_INSTAGRAM_A }}
          S_AO_CHANNEL_INSTAGRAM_B: ${{ secrets.AO_CHANNEL_INSTAGRAM_B }}
          S_AO_CHANNEL_THREADS: ${{ secrets.AO_CHANNEL_THREADS }}
          S_AO_CHANNEL_THREADS_A: ${{ secrets.AO_CHANNEL_THREADS_A }}
          S_AO_CHANNEL_THREADS_B: ${{ secrets.AO_CHANNEL_THREADS_B }}
          S_AO_CHANNEL_YOUTUBE: ${{ secrets.AO_CHANNEL_YOUTUBE }}
          S_AO_CHANNEL_YOUTUBE_A: ${{ secrets.AO_CHANNEL_YOUTUBE_A }}
          S_AO_CHANNEL_YOUTUBE_B: ${{ secrets.AO_CHANNEL_YOUTUBE_B }}
          S_AO_CHANNEL_TIKTOK: ${{ secrets.AO_CHANNEL_TIKTOK }}
          S_AO_CHANNEL_TIKTOK_A: ${{ secrets.AO_CHANNEL_TIKTOK_A }}
          S_AO_CHANNEL_TIKTOK_B: ${{ secrets.AO_CHANNEL_TIKTOK_B }}
          S_AO_CHANNEL_GBP: ${{ secrets.AO_CHANNEL_GBP }}
          S_AO_CHANNEL_GBP_A: ${{ secrets.AO_CHANNEL_GBP_A }}
          S_AO_CHANNEL_GBP_B: ${{ secrets.AO_CHANNEL_GBP_B }}
        run: |
          python3 - <<'PY'
          import os, secrets as rnd
          vals = {k[2:]: v for k, v in os.environ.items() if k.startswith("S_") and v.strip()}
          vals.pop("AO_OPS_TOKEN", None)   # prospect intake token: the press has no business with it
          vals.setdefault("GH_MODELS_TOKEN", os.environ["GH_RUN_TOKEN"])   # models: read on this run's token
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in vals.items():
                  d = "EOF_" + rnd.token_hex(8)
                  f.write(f"{k}<<{d}\n{v}\n{d}\n")
          print("press secrets present:", ", ".join(sorted(k for k in vals if k != "GH_MODELS_TOKEN")) or "none yet")
          PY

      - name: author + validate + publish, then replies
        run: |
          MODE="${{ github.event.inputs.mode || 'live' }}"
          case "$MODE" in
            dry)        F="" ;;
            live)       F="--live" ;;
            live-draft) F="--live --draft-longform" ;;
            *)          echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          mkdir -p "$(dirname "$AO_BSKY_SESSIONS_FILE")"
          # No `|| true`: this publishes live; a swallowed error would read as a green run.
          python3 press/auto.py cycle $F
          python3 press/auto.py autoreply $F
          python3 press/auto.py status || true

      - name: rail health
        id: health
        env: { MODE: "${{ github.event.inputs.mode || 'live' }}" }
        run: |
          F=""; [ "$MODE" = "dry" ] || F="--live"
          python3 press/auto.py health $F

      - name: persist ledger -> press-state branch
        if: always()
        env: { GH_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" }
        run: |
          set -e
          [ -d press/auto ] || exit 0
          rm -rf /tmp/ps && mkdir /tmp/ps && cd /tmp/ps && git init -q && git checkout -q -b press-state
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin press-state >/dev/null 2>&1; then
            git fetch -q --depth 1 "$GH_URL" press-state && git reset -q --soft FETCH_HEAD
          fi
          rm -rf auto && cp -a "$GITHUB_WORKSPACE/press/auto" auto
          rm -f auto/*session* 2>/dev/null || true
          printf 'AttestOS press ledger (state.json, run.log, outbox). Written by .github/workflows/press.yml; never merge into main. Public: post texts and ids only, never keys.\n' > README.md
          git add -A
          git -c user.name=attestos-press -c user.email=press@attestos.invalid commit -qm "press: ledger $(date -u +%FT%H:%MZ)" || { echo "ledger unchanged"; exit 0; }
          git push -q "$GH_URL" HEAD:press-state || { echo "::error::ledger push FAILED - the next run would re-plan the same slots"; exit 1; }

      - name: fail the run on a new rail alert (GitHub emails the owner)
        if: steps.health.outputs.alert == '1'
        run: |
          echo "::error::a press rail is failing; see the rail health annotations (also pushed to the owner's phone)"
          exit 1
